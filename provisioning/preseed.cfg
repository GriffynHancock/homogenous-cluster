# Unattended Debian 12 (bookworm) install for cluster nodes.
#
# Disk-agnostic by design: the fleet is salvaged hardware and disks vary in
# size, type and device name. Do NOT set partman-auto/disk to a fixed device.
#
# Usage: serve this file over HTTP or place on the installer USB, then boot the
# netinst with:  auto=true priority=critical url=<host>/preseed.cfg
# or:            auto=true priority=critical file=/cdrom/preseed.cfg

d-i debian-installer/locale string en_AU
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string unassigned-hostname
d-i netcfg/get_domain string local
# Recycled machines sometimes have a second NIC with no link; do not stall.
d-i netcfg/link_wait_timeout string 15

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i passwd/root-login boolean false
d-i passwd/user-fullname string cluster
d-i passwd/username string cluster
d-i passwd/user-password password changeme
d-i passwd/user-password-again password changeme
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

d-i clock-setup/utc boolean true
d-i time/zone string Australia/Sydney
d-i clock-setup/ntp boolean true

# --- Partitioning -----------------------------------------------------------
# Disk-agnostic: pick the first real disk at install time rather than naming
# one. Note `list-devices disk` also enumerates card readers and USB media on
# this hardware (node 1 has a 0 B "Multi-Card" reader at /dev/sda), so filter
# to devices that actually report a size.
d-i partman/early_command string \
    debconf-set partman-auto/disk "$(for d in $(list-devices disk); do \
        s=$(blockdev --getsize64 $d 2>/dev/null || echo 0); \
        [ "$s" -gt 8000000000 ] && echo $d && break; done)"
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
# Swap is disabled by setup.sh anyway (models are sized to fit RAM; any spill
# into swap collapses throughput). The atomic recipe still creates a small swap
# partition — that is fine, setup.sh masks it.

# --- Apt --------------------------------------------------------------------
# non-free-firmware is REQUIRED on bookworm or recycled NICs may come up with
# no firmware and no network.
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true

tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server sudo curl rsync git build-essential cmake dmidecode pciutils jq python3 python3-venv
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

d-i finish-install/reboot_in_progress note
